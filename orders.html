<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Millgo</title>
    <!-- Render All Elements Normally -->
    <link rel="stylesheet" href="css/normalize.css" />
    <!-- My Own Framework -->
    <link rel="stylesheet" href="css/framework.css" />
    <!-- Fontawesome Library -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- Repeated Style -->
    <link rel="stylesheet" href="css/repeated.css" />
    <!-- Main CSS Style -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- JS File -->
    <script src="JS/script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="page-container ideal-flex">
        <div class="logo">
          <i class="fa-solid fa-building-wheat"></i>
          <span>MillGo</span>
        </div>
        <div class="list">
          <div class="yalahwy p-relative">
            <div class="burger d-none" id="burger">
              <i class="fa-solid fa-burger"></i>
            </div>

            <ul class="d-flex gap-20" id="dropUl">
              <li>Dashboard</li>
              <li>orders</li>
              <li>queue</li>
              <li>deliveries</li>
              <li>reports</li>
            </ul>
          </div>
        </div>
        <div class="account ideal-flex">
          <div class="bell">
            <i class="fa-solid fa-bell"></i>
          </div>
          <div class="pfp">
            <img src="imgs/background.jpg" alt="" />
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
